spring.application.name=ms_orders

# ===============================
# MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/pedidos360_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# SERVIDOR
# ===============================

server.port=8084

# ===============================
# AZURE ENTRA ID
# (el JwtDecoder se arma en SecurityConfig con el issuer v1 sts.windows.net)
# ===============================

# ===============================
# RABBITMQ (publica orden.creada en pedidos360.exchange)
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# ===============================
# MS-PRODUCTOS
# Antes de crear la orden se valida existencia, precio y stock.
# En AWS: variable de entorno PRODUCTOS_API_URL (IP de la EC2 o URL del API Gateway).
# ===============================

productos.api.url=http://localhost:8081
ordenes.validar-productos=true
